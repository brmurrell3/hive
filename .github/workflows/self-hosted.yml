name: Self-Hosted (KVM)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only one run at a time on the self-hosted runner
concurrency:
  group: self-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-build:
    name: Nix Build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4

      - name: Build all packages
        run: |
          nix build .#packages.x86_64-linux.hived --no-link
          nix build .#packages.x86_64-linux.hivectl --no-link
          nix build .#packages.x86_64-linux.hive-agent --no-link

      - name: Verify nix binaries
        run: |
          nix run .#packages.x86_64-linux.hived -- --version
          nix run .#packages.x86_64-linux.hivectl -- version

  vm-tests:
    name: VM Tests (Real KVM)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, nixos, kvm]
    needs: [nix-build]
    steps:
      - uses: actions/checkout@v4

      - name: Verify KVM access
        run: |
          ls -la /dev/kvm 2>&1 || true
          stat /dev/kvm 2>&1 || { echo "ERROR: /dev/kvm not found"; exit 1; }
          # Functional check: try to open the device via bash fd
          exec 3< /dev/kvm && exec 3<&- && echo "KVM access OK" || { echo "ERROR: cannot open /dev/kvm"; exit 1; }
          test -e /dev/vhost-vsock || echo "WARN: /dev/vhost-vsock not found (vsock tests will skip)"

      - name: Verify Firecracker and networking tools
        run: |
          firecracker --version
          command -v nft && command -v ip
          nft list tables || echo "nft list tables failed (may need CAP_NET_ADMIN)"

      - name: Build binaries and VM images
        run: |
          nix develop --command bash -c '
            make build
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/linux-amd64/hive-sidecar ./cmd/hive-sidecar
          '
          git add -f bin/linux-amd64/hive-sidecar
          nix build ./rootfs/nixos#rootfs --out-link result-rootfs
          nix build ./rootfs/nixos#kernel --out-link result-kernel
          cp result-rootfs rootfs/rootfs.ext4
          cp result-kernel/vmlinux rootfs/vmlinux

      - name: Run VM tests with real KVM
        run: |
          nix develop --command bash -c '
            echo "Go version: $(go version)"
            echo "Running VM tests with real KVM..."
            go test -tags vm -race -count=1 -timeout 10m -v ./internal/vm/...
          '

      - name: Run E2E tests with real Firecracker
        run: |
          nix develop --command bash -c '
            echo "Running E2E tests with real Firecracker..."
            go test -tags e2e -race -count=1 -timeout 10m -v ./test/e2e/
          '

      - name: Cleanup
        if: always()
        run: rm -f rootfs/rootfs.ext4 rootfs/vmlinux result-rootfs result-kernel

  e2e-linux:
    name: E2E (Linux Native)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4

      - name: E2E tests
        run: |
          nix develop --command bash -c '
            go test -tags e2e -count=1 -timeout 10m -v ./test/e2e/
          '
        env:
          HIVE_TEST_FIRECRACKER: mock

  nftables:
    name: nftables Integration
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, nixos, kvm]
    steps:
      - uses: actions/checkout@v4

      - name: Verify nftables
        run: |
          which nft && nft --version
          echo "nftables available"

      - name: Run nftables-related tests
        run: |
          nix develop --command bash -c '
            go test -tags unit -run "TestGenerateNftables" -count=1 -v ./internal/vm/
          '

  smoke-linux:
    name: Smoke Test (Linux)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4

      - name: Smoke test
        run: |
          nix develop --command bash -c '
            ./scripts/smoke-test.sh
          '
        env:
          HIVE_TEST_FIRECRACKER: mock

  rootfs-build:
    name: Rootfs Build (Nix)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4

      - name: Build sidecar binary
        run: |
          nix develop --command bash -c '
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/linux-amd64/hive-sidecar ./cmd/hive-sidecar
          '
          # Stage the binary so nix flake evaluation can see it
          git add -f bin/linux-amd64/hive-sidecar

      - name: Build NixOS rootfs and kernel
        run: |
          nix build ./rootfs/nixos#rootfs --out-link result-rootfs
          nix build ./rootfs/nixos#kernel --out-link result-kernel
          ls -lh result-rootfs result-kernel/vmlinux

      - name: Verify rootfs image
        run: |
          nix develop --command bash -c '
            file result-rootfs
            e2fsck -n result-rootfs
          '

      - name: Cleanup
        if: always()
        run: rm -f result-rootfs result-kernel

  full-suite:
    name: Full Test Suite
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, nixos]
    needs: [nix-build]
    steps:
      - uses: actions/checkout@v4

      - name: Unit + Integration tests (race detector)
        run: |
          nix develop --command bash -c '
            go test -tags unit,integration -race -count=1 -timeout 10m ./...
          '

      - name: Fuzz tests (1 minute each)
        run: |
          nix develop --command bash -c '
            go test -tags unit -run="^$" -fuzz="^FuzzParseMemory$" -fuzztime=1m ./internal/config/
            go test -tags unit -run="^$" -fuzz="^FuzzParseDiskSize$" -fuzztime=1m ./internal/config/
            go test -tags unit -run="^$" -fuzz="^FuzzValidateSubjectComponent$" -fuzztime=1m ./internal/types/
            go test -tags unit -run="^$" -fuzz="^FuzzEnvelopeValidate$" -fuzztime=1m ./internal/types/
            go test -tags unit -run="^$" -fuzz="^FuzzAuthenticate$" -fuzztime=1m ./internal/auth/
          '
