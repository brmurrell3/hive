# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

builds:
  - id: hived
    main: ./cmd/hived
    binary: hived
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.buildDate={{ .Date }}

  - id: hivectl
    main: ./cmd/hivectl
    binary: hivectl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.buildDate={{ .Date }}

  - id: hive-agent
    main: ./cmd/hive-agent
    binary: hive-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.buildDate={{ .Date }}

  - id: hive-sidecar
    main: ./cmd/hive-sidecar
    binary: hive-sidecar
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.buildDate={{ .Date }}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "hive-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    ids:
      - hived
      - hivectl
      - hive-agent
      - hive-sidecar
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  github:
    owner: brmurrell3
    name: hive
  draft: true
  replace_existing_draft: true

changelog:
  use: github-native
